services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: twitter_clone_fullstack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d twitter_clone_fullstack"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides the local .env DATABASE_URL (127.0.0.1) so the app
      # connects to the db container instead of localhost.
      DATABASE_URL: postgres://postgres:password@db:5432/twitter_clone_fullstack
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      RUST_LOG: info
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
